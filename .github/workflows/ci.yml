name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Backend (Django check + migraciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        working-directory: backend
        # --no-root: el pyproject declara packages inexistente ("backend/"),
        # y solo necesitamos las dependencias, no instalar el proyecto.
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Django check
        working-directory: backend
        run: poetry run python manage.py check

      - name: Sin cambios de modelo sin migración
        working-directory: backend
        run: poetry run python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint
