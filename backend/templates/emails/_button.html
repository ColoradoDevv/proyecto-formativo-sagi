{# Botón verde + enlace de respaldo. Requiere: button.label, button.url. #}
<div style="text-align:center;margin:24px 0 8px 0;">
<a href="{{ button.url }}" style="display:inline-block;background:#39A900;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 36px;border-radius:10px;">{{ button.label }}</a></div>
<p style="margin:8px 0 0 0;color:#526B7B;font-size:12px;text-align:center;word-break:break-all;">Si el botón no funciona, copia este enlace:<br>
<a href="{{ button.url }}" style="color:#39A900;">{{ button.url }}</a></p>
