{# Caja de credenciales monoespaciada. Requiere: credentials (lista de [etiqueta, valor]). #}
<div style="background:#F0F5EE;border:1px solid #CAD5D3;border-radius:12px;padding:10px 18px;margin:16px 0;">
{% for label, value in credentials %}
<p style="margin:6px 0;color:#203F57;font-size:14px;"><span style="color:#526B7B;">{{ label }}:</span>
<strong style="font-family:Consolas,monospace;">{{ value }}</strong></p>
{% endfor %}
</div>
