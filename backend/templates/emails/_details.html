{# Filas etiqueta/valor. Requiere: details (lista de [etiqueta, valor]). #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0 16px 0;">
{% for label, value in details %}
<tr><td style="padding:6px 0;color:#526B7B;font-size:14px;">{{ label }}</td>
<td style="padding:6px 0 6px 12px;color:#203F57;font-size:14px;font-weight:bold;text-align:right;">{{ value }}</td></tr>
{% endfor %}
</table>
